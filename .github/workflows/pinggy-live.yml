name: pinggy live

# The Pinggy road (T-548) through Pinggy's own free tier, `free.pinggy.io`
# (pod-services), a last fallback of the operator's ruling Q78; a short run
# that Q91 allows: one node with a throwaway key, one client, `greet` and
# 1 MiB down, and the node stopped at the end, which gives its tunnel up. A
# planted run makes the client name another node's key, and must fail. No
# credential goes to Pinggy: a free tunnel has no account. Started by hand
# alone; it publishes nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinggy-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the test
        run: cargo test --locked -p podssh-cli --test pinggy_live --no-run
      # T-548: also the client once through mitmproxy, a proxy that ends TLS
      # on the client's side with a CA that the client is given (a measure).
      - name: mitmproxy, a proxy that ends TLS
        run: |
          python3 -m venv "$RUNNER_TEMP/mitm"
          "$RUNNER_TEMP/mitm/bin/pip" install --quiet mitmproxy==12.1.2
          "$RUNNER_TEMP/mitm/bin/mitmdump" --listen-host 127.0.0.1 -p 8081 --set confdir="$RUNNER_TEMP/mitmconf" \
            >"$RUNNER_TEMP/mitm.log" 2>&1 &
          for _ in $(seq 1 30); do [ -s "$RUNNER_TEMP/mitmconf/mitmproxy-ca-cert.pem" ] && break; sleep 1; done
          test -s "$RUNNER_TEMP/mitmconf/mitmproxy-ca-cert.pem"
          echo "PODSSH_PINGGY_TEST_INTERCEPT=http://127.0.0.1:8081|$RUNNER_TEMP/mitmconf/mitmproxy-ca-cert.pem" >> "$GITHUB_ENV"
      - name: a short run through Pinggy
        run: |
          timeout 300 cargo test --locked -p podssh-cli --test pinggy_live -- --ignored --nocapture
      # The check must see a client that names another node's key fail.
      - name: a planted stranger fails it
        env:
          PODSSH_PINGGY_TEST_PLANT: stranger
          PODSSH_PINGGY_TEST_INTERCEPT: ""
        run: |
          rc=0
          timeout 300 cargo test --locked -p podssh-cli --test pinggy_live -- --ignored || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "the check is vacuous: another node's key passed"
            exit 1
          fi
          echo "another node's key failed (exit $rc), as it must"
