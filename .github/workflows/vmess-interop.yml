name: vmess interop

# VMess's AEAD form (T-739, the operator's ruling Q78), the third line form of
# the public proxy nodes, against Xray-core, a server that podssh did not
# write: the release that scripts/interop-vless.sh pins (its zip checked
# against the pinned SHA-256), run by crates/podssh-ws/tests/vmess.rs on the
# loopback over a WebSocket and TLS, with a certificate that openssl makes for
# the run. Each cipher, a pipe, a clock 5 minutes off, another ID and another
# path. Each test says "did not run" with no Xray-core, so the job fails on
# that word. Started by hand, and on a push that changes the road; it
# publishes nothing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/podssh-ws/src/vmess/**"
      - "crates/podssh-ws/tests/vmess.rs"
      - ".github/workflows/vmess-interop.yml"

permissions:
  contents: read

# A newer push cancels the run of the older one (the operator, 2026-11-11).
concurrency:
  group: vmess-interop-${{ github.ref }}
  cancel-in-progress: true

env:
  XRAY_RELEASE: "v26.10.21"
  XRAY_SHA256: "0eec3ed4163c273d8c8bf821f7d219e257921cf584aa3fb970715e458e631978"

jobs:
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xray-core of the pinned release
        run: |
          set -eu
          mkdir -p .work/xray
          curl -qfsSL --retry 3 --max-time 120 -o .work/xray/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/$XRAY_RELEASE/Xray-linux-64.zip"
          echo "$XRAY_SHA256  .work/xray/xray.zip" | sha256sum -c -
          python3 -I -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extract("xray", sys.argv[2])' \
            .work/xray/xray.zip .work/xray
          chmod 755 .work/xray/xray
          echo "PODSSH_XRAY_TEST_BIN=$PWD/.work/xray/xray" >> "$GITHUB_ENV"
      - name: the road against Xray-core
        run: |
          set -o pipefail
          cargo test --locked -p podssh-ws --lib vmess
          timeout 900 cargo test --locked -p podssh-ws --test vmess -- --nocapture 2>&1 | tee "$RUNNER_TEMP/vmess.log"
          grep -q "test result: ok. 3 passed" "$RUNNER_TEMP/vmess.log"
          if grep -q "did not run" "$RUNNER_TEMP/vmess.log"; then echo "a test did not run"; exit 1; fi
