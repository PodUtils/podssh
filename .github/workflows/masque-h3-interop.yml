name: masque h3 interop

# T-582: MASQUE's connect-ip over HTTP/3 (the operator's ruling Q82), on
# pod-warp's road (PodUtils/podcrates). The interop against connect-ip-go's
# integration proxy, a server of the user's own, waits for pod-warp to
# speak RFC 9484 to such a server (PodUtils/podcrates T-481).
#
# live: by hand alone, with confirm=Q52 (the operator's leave for WARP,
# Q52, Q59): podssh with the feature warp registers one throwaway device
# (PODSSH_WARP_ACCEPT_TERMS=yes for this run), and with PODSSH_WARP_H3=first
# reaches GitHub's SSH endpoint inside WARP's tunnel over HTTP/3, on UDP
# 443, to the refusal of a client with no key; -v must say that the tunnel
# opened over HTTP/3. A few minutes. The device's record, a private file,
# is removed at the end; no line prints it.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Q52: the operator's leave for the live job against WARP"
        required: true
        default: ""

permissions:
  contents: read

# A newer push cancels the run of the older one (the operator, 2026-11-11).
concurrency:
  group: masque-h3-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'Q52'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "4"
      PODSSH_CACHE_DIR: ${{ github.workspace }}/../podssh-cache
      # GitHub's published Ed25519 host key, as warp-live.yml checks it.
      GITHUB_ED25519: "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: podssh with the feature warp, built from this commit
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          timeout 1200 cargo build -p podssh-cli --locked --features warp
          mkdir -p "$PODSSH_CACHE_DIR"
      - name: podssh ssh -v to GitHub inside WARP's tunnel over HTTP/3
        run: |
          set +e
          PODSSH_WARP_ACCEPT_TERMS=yes PODSSH_WARP_H3=first timeout 120 target/debug/podssh ssh -v -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            warp://git@github.com </dev/null >"$RUNNER_TEMP/ssh.out" 2>"$RUNNER_TEMP/ssh.log"
          rc=$?
          set -e
          sed 's/^/podssh: /' "$RUNNER_TEMP/ssh.log"
          echo "podssh ssh exited $rc"
          grep -q "WARP's tunnel opened over HTTP/3" "$RUNNER_TEMP/ssh.log" \
            || { echo "FAIL the tunnel did not open over HTTP/3"; exit 1; }
          grep -q "Permission denied (publickey)" "$RUNNER_TEMP/ssh.log" || { echo "FAIL no refusal of GitHub's ($rc)"; exit 1; }
          [ "$rc" = 255 ] || { echo "FAIL exit $rc, not 255"; exit 1; }
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | tee "$RUNNER_TEMP/keys.txt"
          grep -q "$GITHUB_ED25519" "$RUNNER_TEMP/keys.txt" || { echo "FAIL the host key is not GitHub's"; exit 1; }
          echo "ok    the SSH handshake with GitHub passed inside WARP's tunnel over HTTP/3"
      - name: the device's record removed
        if: always()
        run: rm -rf "$PODSSH_CACHE_DIR"
