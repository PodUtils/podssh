name: zerotier interop

# ZeroTier's road (T-733) against ZeroTierOne's own software, MPL-2.0, of
# the pinned commit: its `tcp-proxy`, built here and run with sudo on its
# fixed port 443, in front of the test's own UDP echo on the loopback:
# crates/podssh-zerotier/tests/tcp_proxy.rs. No host of ZeroTier Inc. is
# reached. A planted encoder that takes what the relay drops must fail. And
# the command line from end to end, a node and a client of one pair through
# podssh-zerotier's stand-in relay and root (tests/derp_road.rs, the module
# derp_zerotier); a planted client of another pair must fail. And the
# binary with the feature, static musl in the gate's image, as the release
# builds it: the C++ of the core links statically too.
# Started by hand, and on a push that changes the crate; it publishes nothing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/podssh-zerotier/**"
      - "crates/podssh-cli/src/zerotier.rs"
      - "crates/podssh-cli/src/node_zerotier.rs"
      - "crates/podssh-cli/src/ssh/zerotier.rs"
      - "crates/podssh-cli/tests/derp_zerotier/**"
      - "vendor/zerotier-node/**"
      - "scripts/plants/t733-*"
      - ".github/workflows/zerotier-interop.yml"

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
      ZEROTIER_COMMIT: "899352e"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ZeroTierOne's tcp-proxy, of the pinned commit
        run: |
          set -eu
          git clone -q https://github.com/zerotier/ZeroTierOne.git "$RUNNER_TEMP/zt"
          cd "$RUNNER_TEMP/zt" && git checkout -q "$ZEROTIER_COMMIT" && cd tcp-proxy
          g++ -O2 -I../ext/prometheus-cpp-lite-1.0/core/include -I../ext/prometheus-cpp-lite-1.0/simpleapi/include \
            -std=c++11 -pthread -o tcp-proxy tcp-proxy.cpp ../node/Metrics.cpp
          sudo nohup ./tcp-proxy > "$RUNNER_TEMP/proxy.log" 2>&1 &
          sleep 1
      - name: the core's tests, and the framing through ZeroTier's relay
        run: |
          set -o pipefail
          cargo test --locked -p podssh-zerotier
          PODSSH_ZT_TCP_PROXY=127.0.0.1:443 timeout 300 cargo test --locked -p podssh-zerotier --test tcp_proxy -- --ignored 2>&1 | tee "$RUNNER_TEMP/run.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/run.log"
      - name: a planted encoder of what the relay drops fails
        run: |
          git apply scripts/plants/t733-relay-drops.patch
          rc=0
          timeout 600 cargo test --locked -p podssh-zerotier --lib relay || rc=$?
          git apply -R scripts/plants/t733-relay-drops.patch
          if [ "$rc" -eq 0 ]; then
            echo "the check is vacuous: the planted encoder passed"
            exit 1
          fi
          echo "the planted encoder failed (exit $rc), as it must"
      - name: the command line from end to end, through the stand-in relay and root
        run: timeout 1200 cargo test --locked -p podssh-cli --features zerotier-test --test derp_road -- derp_zerotier
      - name: a planted client of another pair fails
        run: |
          git apply scripts/plants/t733-other-pair.patch
          rc=0
          timeout 1200 cargo test --locked -p podssh-cli --features zerotier-test --test derp_road -- derp_zerotier || rc=$?
          git apply -R scripts/plants/t733-other-pair.patch
          if [ "$rc" -eq 0 ]; then
            echo "the check is vacuous: a client of another pair reached the node"
            exit 1
          fi
          echo "the planted client failed (exit $rc), as it must"

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the build image
        run: |
          set -eu
          ref=$(tr -d '\r' < images/build/Dockerfile | sed -n 's/^FROM[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p')
          case "$ref" in
            *@sha256:*) echo "BUILD_IMAGE=$ref" >> "$GITHUB_ENV" ;;
            *) echo "images/build/Dockerfile names no image pinned to a digest" >&2; exit 1 ;;
          esac
      - name: build with the road (static musl, in the gate's image)
        run: |
          image=$(sh scripts/pull-image.sh "$BUILD_IMAGE")
          docker run --rm -v "$PWD:/work" -w /work \
            -e CARGO_BUILD_JOBS=4 -e RUSTFLAGS=-Ctarget-feature=+crt-static \
            "$image" \
            cargo build --locked --release --target x86_64-unknown-linux-musl -p podssh-cli --features iroh,warp,zerotier
      - name: the binary is static, and runs
        run: |
          set -eu
          B=target/x86_64-unknown-linux-musl/release/podssh
          sh scripts/check-static.sh "$B"
          ls -l "$B"
          "$B" --version
          "$B" man --no-pager | grep -q PODSSH_ZEROTIER_PLANET
