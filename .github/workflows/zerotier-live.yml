name: zerotier live

# ZeroTier's road (T-733) through ZeroTier Inc.'s own roots and TCP relay,
# the relay of pod-services: a short run that Q78 and Q91 allow, two members
# of one process with identities made for the run, 64 KiB each way, then the
# process ends and the identities with it. No credential goes to ZeroTier:
# an ad-hoc network has no account. A planted run puts the second member on
# another network, and must fail. Then the command line from end to end:
# a `podssh node --derp` of a pair whose relay is down, and `podssh ssh
# node://` of the same pair (the fixture's tokens, no credential), meet
# through the same roots and relay alone; a planted client of another pair
# must fail. The library's steps print each member's trace (PODSSH_ZT_TRACE)
# each 2 s. And the job `one`: ZeroTierOne's own zerotier-one, built from
# the pinned commit, joins the same kind of network through the roots, and
# TCP passes both ways between its host and a member of podssh through the
# relay (crates/podssh-zerotier/tests/zerotier_one.rs); planted, a member
# that looks for another node must fail. Started by hand alone; it
# publishes nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the test
        run: cargo test --locked -p podssh-zerotier --test live --no-run
      - name: a short run through the roots and the relay
        run: |
          set -o pipefail
          PODSSH_ZT_TRACE=1 timeout 300 cargo test --locked -p podssh-zerotier --test live -- --ignored --nocapture two_members 2>&1 | tee "$RUNNER_TEMP/run.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/run.log"
      - name: a planted member of another network fails it
        run: |
          rc=0
          PODSSH_ZT_LIVE_PLANT=other timeout 300 cargo test --locked -p podssh-zerotier --test live -- --ignored two_members || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "the check is vacuous: a member of another network was reached"
            exit 1
          fi
          echo "the planted member failed (exit $rc), as it must"
      - name: the pair's road of the library through the roots and the relay
        run: |
          set -o pipefail
          PODSSH_ZT_TRACE=1 timeout 300 cargo test --locked -p podssh-zerotier --test live -- --ignored --nocapture the_pair_s_road 2>&1 | tee "$RUNNER_TEMP/pair.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/pair.log"
      - name: the command line through the roots and the relay
        run: |
          set -o pipefail
          timeout 600 cargo test --locked -p podssh-cli --features zerotier-test --test derp_road -- --ignored --nocapture live_through_zerotier 2>&1 | tee "$RUNNER_TEMP/cli.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/cli.log"
      - name: a planted client of another pair fails it
        run: |
          git apply scripts/plants/t733-other-pair.patch
          rc=0
          timeout 600 cargo test --locked -p podssh-cli --features zerotier-test --test derp_road -- --ignored live_through_zerotier || rc=$?
          git apply -R scripts/plants/t733-other-pair.patch
          if [ "$rc" -eq 0 ]; then
            echo "the check is vacuous: a client of another pair reached the node"
            exit 1
          fi
          echo "the planted client failed (exit $rc), as it must"

  one:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "4"
      ZEROTIER_COMMIT: "899352e"
      NWID: "ff10001000000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the test
        run: cargo test --locked -p podssh-zerotier --test zerotier_one --no-run
      - name: ZeroTierOne's zerotier-one, of the pinned commit
        run: |
          set -eu
          git clone -q https://github.com/zerotier/ZeroTierOne.git "$RUNNER_TEMP/zt"
          cd "$RUNNER_TEMP/zt" && git checkout -q "$ZEROTIER_COMMIT"
          make -j4 one ZT_SSO_SUPPORTED=0 > "$RUNNER_TEMP/make.log" 2>&1 || { tail -40 "$RUNNER_TEMP/make.log"; exit 1; }
          sudo mkdir -p /var/lib/zerotier-one
          sudo nohup ./zerotier-one > "$RUNNER_TEMP/one.log" 2>&1 &
          for i in $(seq 60); do sudo ./zerotier-one -q info 2>/dev/null | grep -q ONLINE && break; sleep 2; done
          sudo ./zerotier-one -q info
          sudo ./zerotier-one -q join "$NWID"
          echo "ZT_NODE=$(sudo ./zerotier-one -q info | awk '{print $3}')" >> "$GITHUB_ENV"
          for i in $(seq 60); do ip -6 addr | grep -q 'inet6 fc' && break; sleep 2; done
          ip -6 addr | grep 'inet6 fc'
      - name: an echo on the runner, at each address
        run: |
          cat > "$RUNNER_TEMP/echo.py" <<'PY'
          import socket, threading
          s = socket.socket(socket.AF_INET6, socket.SOCK_STREAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("::", 4096)); s.listen(4)
          def serve(c):
              with c:
                  while (b := c.recv(4096)): c.sendall(b)
          while True:
              c, _ = s.accept(); threading.Thread(target=serve, args=(c,), daemon=True).start()
          PY
          nohup python3 -I "$RUNNER_TEMP/echo.py" > "$RUNNER_TEMP/echo.log" 2>&1 &
      - name: TCP both ways between zerotier-one's host and a member of podssh
        run: |
          set -u
          out="$RUNNER_TEMP/member.txt"
          PODSSH_ZT_ONE_OUT="$out" PODSSH_ZT_ONE_NODE="$ZT_NODE" timeout 400 \
            cargo test --locked -p podssh-zerotier --test zerotier_one -- --ignored --nocapture > "$RUNNER_TEMP/test.log" 2>&1 &
          test_pid=$!
          for i in $(seq 120); do [ -s "$out" ] && break; sleep 1; done
          addr=$(cat "$out")
          cat > "$RUNNER_TEMP/client.py" <<'PY'
          import socket, sys, time
          end = time.time() + 180
          while time.time() < end:
              try:
                  c = socket.create_connection((sys.argv[1], 4096), timeout=20)
                  c.sendall(b"zerotier-one to podssh")
                  got = c.recv(64)
                  print("echo:", got)
                  sys.exit(0 if got == b"zerotier-one to podssh" else 1)
              except OSError as e:
                  print("again:", e); time.sleep(3)
          sys.exit(1)
          PY
          rc_client=0
          python3 -I "$RUNNER_TEMP/client.py" "$addr" || rc_client=$?
          rc_test=0
          wait "$test_pid" || rc_test=$?
          cat "$RUNNER_TEMP/test.log"
          echo "client $rc_client, test $rc_test"
          [ "$rc_client" -eq 0 ] && [ "$rc_test" -eq 0 ]
      - name: a planted member that looks for another node fails it
        run: |
          rc=0
          PODSSH_ZT_ONE_OUT="$RUNNER_TEMP/planted.txt" PODSSH_ZT_ONE_NODE=0123456789 timeout 400 \
            cargo test --locked -p podssh-zerotier --test zerotier_one -- --ignored || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "the check is vacuous: a member reached a node that is not there"
            exit 1
          fi
          echo "the planted member failed (exit $rc), as it must"
