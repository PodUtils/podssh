name: hyperdht interop

# HyperDHT's road (T-736) against the `hyperdht` package of Node.js, MIT,
# pinned at 6.36.0: a private DHT of three of its nodes on the loopback,
# which the tests start themselves (crates/podssh-relay/tests/hyperdht/
# testnet.js). No node of the public DHT is reached. The library
# (crates/podssh-relay/tests/hyperdht.rs): a pair's node and its client meet
# by key and carry a MiB whole, and a bootstrap that never answers reads as
# UDP that does not pass; and the command line from end to end
# (tests/derp_road.rs, the module derp_hyperdht). Each test says "did not
# run" with no package, so the job fails on that word. A client of another
# pair must fail (scripts/plants/t736-*).
# By hand only, the job `live`: one short session from end to end through
# the public DHT where the runner's UDP passes, by Q77 and Q82 (T-548's
# Decision), its bootstrap read at run time from the package's own
# constants, so that no host of another party is in podssh's source;
# podssh's list of the bootstrap is pod-services'.
# Started by hand, and on a push that changes the road; it publishes nothing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/podssh-relay/src/hyperdht.rs"
      - "crates/podssh-relay/tests/hyperdht.rs"
      - "crates/podssh-relay/tests/hyperdht/**"
      - "crates/podssh-cli/src/hyperdht.rs"
      - "crates/podssh-cli/src/node_hyperdht.rs"
      - "crates/podssh-cli/src/ssh/hyperdht.rs"
      - "crates/podssh-cli/tests/derp_hyperdht/**"
      - "scripts/plants/t736-*"
      - ".github/workflows/hyperdht-interop.yml"

permissions:
  contents: read

# A newer push cancels the run of the older one (the operator, 2026-11-11).
concurrency:
  group: hyperdht-interop-${{ github.ref }}
  cancel-in-progress: true

env:
  HYPERDHT_VERSION: "6.36.0"

jobs:
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node.js's hyperdht of the pinned release
        run: |
          set -eu
          mkdir -p .work/hdht && cd .work/hdht
          npm init -y >/dev/null
          npm install --no-audit --no-fund "hyperdht@$HYPERDHT_VERSION"
          node -e "console.log(require('hyperdht/package.json').version)"
          echo "PODSSH_HYPERDHT_TEST_NODE_PATH=$PWD/node_modules" >> "$GITHUB_ENV"
      - name: the library against a private DHT of Node.js's nodes
        run: |
          set -o pipefail
          cargo test --locked -p podssh-relay --features hyperdht --lib hyperdht
          timeout 900 cargo test --locked -p podssh-relay --features hyperdht --test hyperdht -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/relay.log"
          grep -q "test result: ok. 2 passed" "$RUNNER_TEMP/relay.log"
          if grep -q "did not run" "$RUNNER_TEMP/relay.log"; then echo "a test did not run"; exit 1; fi
      - name: the command line from end to end, through the private DHT
        run: |
          set -o pipefail
          timeout 1200 cargo test --locked -p podssh-cli --features hyperdht --test derp_road -- --nocapture derp_hyperdht 2>&1 | tee "$RUNNER_TEMP/cli.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/cli.log"
          if grep -q "did not run" "$RUNNER_TEMP/cli.log"; then echo "the test did not run"; exit 1; fi
      - name: the planted defects fail
        run: sudo -E env "PATH=$PATH" sh scripts/plant-each.sh --here --group host-hyperdht

  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: one session through the public DHT
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/hdht" && cd "$RUNNER_TEMP/hdht"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "hyperdht@$HYPERDHT_VERSION" >/dev/null
          bootstrap=$(node -e "console.log(require('hyperdht/lib/constants').BOOTSTRAP_NODES.join(','))")
          test -n "$bootstrap"
          cd "$GITHUB_WORKSPACE"
          PODSSH_HYPERDHT_TEST_BOOTSTRAP="$bootstrap" timeout 600 cargo test --locked -q -p podssh-cli --features hyperdht \
            --test derp_road -- --nocapture derp_hyperdht
