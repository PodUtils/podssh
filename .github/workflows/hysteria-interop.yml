name: hysteria interop

# The Hysteria 2 road (T-580, the operator's ruling Q82) against Hysteria's
# own server (apernet/hysteria, MIT), a server that podssh did not write: the
# pinned release's linux-amd64 binary, checked against the SHA-256 that its
# hashes.txt gives, run by crates/podssh-ws/tests/hysteria.rs on the loopback
# with a certificate that openssl makes for the run. The banner and an echo
# by a root, by a pin and under Salamander; a wrong password, a wrong pin,
# another Salamander key and an unreachable target refused; a port that
# drops UDP ends at the probe. Each test of the server says "did not run"
# with no binary, so the job fails on that word. Started by hand, and on a
# push that changes the road; it publishes nothing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/podssh-ws/src/hysteria/**"
      - "crates/podssh-ws/tests/hysteria.rs"
      - ".github/workflows/hysteria-interop.yml"

permissions:
  contents: read

# A newer push cancels the run of the older one (the operator, 2026-11-11).
concurrency:
  group: hysteria-interop-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tag app/v2.13.0, its slash encoded in the release's URL.
  HYSTERIA_RELEASE: "app%2Fv2.13.0"
  # build/hysteria-linux-amd64 of the release's hashes.txt, and the digest of
  # the binary that it names, read on 2026-11-12.
  HYSTERIA_SHA256: "907ba8c9693edb104b20582681fb7dc15639d5b64a9cbb616a7b539190a86691"

jobs:
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hysteria of the pinned release
        run: |
          set -eu
          mkdir -p .work/hysteria
          curl -qfsSL --retry 3 --max-time 120 -o .work/hysteria/hysteria \
            "https://github.com/apernet/hysteria/releases/download/${HYSTERIA_RELEASE}/hysteria-linux-amd64"
          echo "$HYSTERIA_SHA256  .work/hysteria/hysteria" | sha256sum -c -
          chmod 755 .work/hysteria/hysteria
          echo "PODSSH_HYSTERIA_TEST_BIN=$PWD/.work/hysteria/hysteria" >> "$GITHUB_ENV"
      - name: the road against Hysteria
        run: |
          set -o pipefail
          cargo test --locked -p podssh-ws --features quic --lib hysteria
          timeout 900 cargo test --locked -p podssh-ws --features quic --test hysteria -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/hysteria.log"
          grep -q "test result: ok. 3 passed" "$RUNNER_TEMP/hysteria.log"
          if grep -q "did not run" "$RUNNER_TEMP/hysteria.log"; then echo "a test did not run"; exit 1; fi
