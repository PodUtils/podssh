name: ygg interop

# Yggdrasil's road (T-735) against yggdrasil-go's own node, LGPL-3.0, built
# here with Go from its tag v0.5.15 (2c7f050f), its link on ws:// on the
# loopback, no TUN, no admin socket and no multicast; the tests start it
# themselves. No node of the public network is reached. The link and the
# router (crates/podssh-relay/tests/ygg_network.rs): two routers reach each
# other by key; a pair's node echoes a MiB to its client and refuses another
# token; and the command line from end to end (tests/derp_road.rs, the
# module derp_ygg). Each test says "did not run" with no yggdrasil, so the
# job fails on that word. A node that takes a hello with no proof, and a
# client of another pair, must fail (scripts/plants/t735-*).
# By hand only, the job `live`: one short session from end to end through a
# public wss:// peer of the network on 443, a service of Q78 (a live target
# of Q91), picked at run time from the network's own list of public peers,
# so that no host of another party is in podssh's source; podssh's list of
# the peers is pod-services'.
# Started by hand, and on a push that changes the road; it publishes nothing.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/podssh-relay/src/ygg/**"
      - "crates/podssh-relay/src/packet_stream.rs"
      - "crates/podssh-relay/tests/ygg_network.rs"
      - "crates/podssh-cli/src/yggdrasil.rs"
      - "crates/podssh-cli/src/node_ygg.rs"
      - "crates/podssh-cli/src/ssh/ygg.rs"
      - "crates/podssh-cli/tests/derp_ygg/**"
      - "scripts/plants/t735-*"
      - ".github/workflows/ygg-interop.yml"

permissions:
  contents: read

# A newer push cancels the run of the older one (the operator, 2026-11-11).
concurrency:
  group: ygg-interop-${{ github.ref }}
  cancel-in-progress: true

env:
  YGGDRASIL_TAG: "v0.5.15"
  YGGDRASIL_COMMIT: "2c7f050fc5398ecd8ac5f77e9bb5bd91aa2e9e35"

jobs:
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: yggdrasil-go of the pinned tag
        run: |
          set -eu
          git clone -q --depth 1 --branch "$YGGDRASIL_TAG" https://github.com/yggdrasil-network/yggdrasil-go .work/ygg-go
          test "$(git -C .work/ygg-go rev-parse HEAD)" = "$YGGDRASIL_COMMIT"
          (cd .work/ygg-go && go build -o ../yggdrasil ./cmd/yggdrasil)
          echo "PODSSH_YGG_TEST_BIN=$PWD/.work/yggdrasil" >> "$GITHUB_ENV"
      - name: the link and the router against yggdrasil-go's node
        run: |
          set -o pipefail
          cargo test --locked -p podssh-relay --features yggdrasil --lib ygg
          timeout 900 cargo test --locked -p podssh-relay --features yggdrasil --test ygg_network -- --nocapture 2>&1 | tee "$RUNNER_TEMP/relay.log"
          grep -q "test result: ok. 2 passed" "$RUNNER_TEMP/relay.log"
          if grep -q "did not run" "$RUNNER_TEMP/relay.log"; then echo "a test did not run"; exit 1; fi
      - name: the command line from end to end, through yggdrasil-go's node
        run: |
          set -o pipefail
          timeout 1200 cargo test --locked -p podssh-cli --features yggdrasil --test derp_road -- --nocapture derp_ygg 2>&1 | tee "$RUNNER_TEMP/cli.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/cli.log"
          if grep -q "did not run" "$RUNNER_TEMP/cli.log"; then echo "the test did not run"; exit 1; fi
      - name: the planted defects fail
        run: sudo -E env "PATH=$PATH" sh scripts/plant-each.sh --here --group host-ygg

  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: one session through a public wss:// peer of the network on 443
        run: |
          set -eu
          git clone -q --depth 1 https://github.com/yggdrasil-network/public-peers "$RUNNER_TEMP/peers"
          # Each wss:// peer on 443 that the list names, by a name or an IPv4 address.
          grep -rhoE 'wss://[A-Za-z0-9.-]+(:443)?(/[A-Za-z0-9._/-]*)?' "$RUNNER_TEMP/peers" --include='*.md' \
            | sed -E 's#^(wss://[^/:]+)(:443)?#\1:443#' | sort -u > "$RUNNER_TEMP/wss.txt" || true
          test -s "$RUNNER_TEMP/wss.txt" || { echo "the list names no wss:// peer on 443"; exit 1; }
          wc -l < "$RUNNER_TEMP/wss.txt"
          cargo build --locked -q -p podssh-cli --features yggdrasil --tests
          rc=1
          while read -r peer; do
            echo "the peer $peer"
            if PODSSH_YGG_TEST_PEER="$peer" timeout 300 cargo test --locked -q -p podssh-cli --features yggdrasil \
                --test derp_road -- --nocapture derp_ygg; then rc=0; break; fi
          done < "$RUNNER_TEMP/wss.txt"
          exit $rc
