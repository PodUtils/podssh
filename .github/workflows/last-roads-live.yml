name: last roads live

# The last roads of all (Q78) through their own public servers, named by
# pod-services: localhost.run (T-565), localtunnel.me (T-568) and bore.pub
# (T-569); short runs that Q91 allows: for each, one node with a throwaway
# key, one client, `greet` and 1 MiB down, each other road off, and the node
# stopped at the end, which gives its tunnel up. A planted run makes the
# client name another node's key, and must fail. No credential goes to
# them: a free tunnel has no account. Started by hand alone; it publishes
# nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: last-roads-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test:
          - a_node_behind_localhost_run_serves_a_client_at_its_tunnel_s_url
          - a_node_behind_localtunnel_serves_a_client_that_names_its_key
          - a_node_at_its_bore_port_serves_a_client_that_names_its_key
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the test
        run: cargo test --locked -p podssh-cli --test last_roads_live --no-run
      - name: a short run through the road
        # A name that matches no test runs none and exits 0: one must pass.
        run: |
          set -o pipefail
          timeout 300 cargo test --locked -p podssh-cli --test last_roads_live -- --ignored --exact "${{ matrix.test }}" --nocapture 2>&1 | tee "$RUNNER_TEMP/run.log"
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/run.log"
      # The check must see a client that names another node's key fail.
      - name: a planted stranger fails it
        env:
          PODSSH_LAST_TEST_PLANT: stranger
        run: |
          rc=0
          timeout 300 cargo test --locked -p podssh-cli --test last_roads_live -- --ignored --exact "${{ matrix.test }}" --nocapture || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "the check is vacuous: another node's key passed"
            exit 1
          fi
          echo "another node's key failed (exit $rc), as it must"
