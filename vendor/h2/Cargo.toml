# h2 0.4.20 as published, with one patch of podssh's: the pseudo-fields of a
# request are encoded in Chrome's order, `:method`, `:authority`, `:scheme`,
# `:path`, rather than the library's fixed `:method`, `:scheme`, `:authority`,
# `:path` (T-763). RFC 9113 does not fix the order among pseudo-fields, so
# both are valid; a browser shape must send the one that a browser sends.
[package]
name = "h2"
version = "0.4.20"
edition = "2021"
rust-version = "1.63"
license = "MIT"
description = "An HTTP/2 client and server"
repository = "https://github.com/hyperium/h2"

[features]
default = []
stream = []
unstable = []

[lib]
name = "h2"
path = "src/lib.rs"

[dependencies]
atomic-waker = "1.0.0"
bytes = "1"
fnv = "1.0.5"
futures-core = { version = "0.3", default-features = false }
futures-sink = { version = "0.3", default-features = false }
http = "1.1"
indexmap = { version = "2", features = ["std"] }
slab = "0.4.2"
tokio = { version = "1", features = ["io-util"] }
tokio-util = { version = "0.7.1", features = ["codec", "io"] }
tracing = { version = "0.1.35", default-features = false, features = ["std"] }
