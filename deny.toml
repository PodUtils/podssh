# cargo-deny: the advisories, licenses, duplicate versions and sources of the
# dependencies, in CI (.github/workflows/deny.yml) and by hand:
#
#   cargo deny --locked check advisories licenses bans sources
#   cargo deny --locked --all-features check licenses sources

[graph]
all-features = false
# The targets that podssh builds and ships (T-218 gives the list): a crate that
# only another target compiles, as the browser's WebSocket of iroh's relay
# client (T-162), is in no release, and is not checked.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "armv7-unknown-linux-musleabihf",
  "riscv64gc-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory names its reason and the date it was read.
ignore = [
  # Marvin: the private-key operations of `rsa` are not constant-time, and no
  # fixed version exists. podssh-ws only verifies RSA signatures, with public
  # keys. Since T-257 an RSA user key signs, and podssh keygen makes one,
  # through aws-lc-rs, and podssh agent keeps no RSA key; a test of
  # podssh-ssh reads the source for each way back. russh's reader of a PEM or
  # PKCS#8 RSA key still computes with it once. Read 2026-10-09 and
  # 2026-10-11.
  { id = "RUSTSEC-2023-0071", reason = "no fixed version; rsa only verifies, and russh reads a PEM key with it once; RSA signing and keygen use aws-lc-rs (T-257)" },
  # paste is unmaintained, not open to an attack: a proc-macro, which runs
  # at build time only, that only the Tailscale fork brings (through
  # stun-rs). The fork's own deny.toml ignores it too. Read 2026-10-09.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc-macro, only through the Tailscale fork" },
  # SQLite before 3.54.0 can return stale page-cache memory when it opens a
  # database with a crafted `-wal` file of another page size. Only the Tor
  # road (feature `tor`) links it, through arti's tor-dirmgr, and each arti
  # release up to 0.48 (tor-dirmgr `rusqlite >=0.36, <0.41`) refuses the
  # rusqlite 0.41 that brings the fixed libsqlite3-sys 0.39. Arti opens only
  # the database of podssh's own cache directory, which its permission check
  # (fs-mistrust) refuses when another user can write it; the exposure is a
  # party that already writes the user's own files. Take the fix when arti
  # accepts rusqlite 0.41. Read 2026-11-11.
  { id = "RUSTSEC-2026-0459", reason = "no arti release takes the fixed libsqlite3-sys; arti opens only podssh's own cache, which its permission check keeps to the user" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Each license that a crate of the graph needs, by name. A crate offered
# under a choice is checked against the choice; LGPL is not allowed, as the
# release binaries are static.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# Copyleft for each file, and only in the Tailscale fork (feature ts): its
# source stays with the crate, and its notice ships with the release.
exceptions = [
  { allow = ["MPL-2.0"], crate = "dyn-eq" },
  # The Tor road's crates (feature tor, T-353), in no release binary: copyleft
  # for each file, the crates unchanged (priority-queue offers MPL-2.0 or
  # LGPL-3.0, and MPL-2.0 is taken), and two dedications to the public domain.
  { allow = ["MPL-2.0"], crate = "option-ext" },
  { allow = ["MPL-2.0"], crate = "priority-queue" },
  { allow = ["Unlicense"], crate = "async_executors" },
  { allow = ["CC0-1.0"], crate = "notify" },
  # Its onion services (T-578): Boost's permissive license, through
  # tor-hsservice's growable-bloom-filter, the crate unchanged.
  { allow = ["BSL-1.0"], crate = "xxhash-rust" },
  # Yggdrasil's router (feature yggdrasil, T-735): copyleft for each file, the
  # crate unchanged in its own repository, as ZeroTier's core is (T-733).
  { allow = ["MPL-2.0"], crate = "ironwood" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of the workspace and of the fork are paths, not releases.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/PodUtils/podcrates", "https://github.com/Revertron/Yggdrasil-ng"]
