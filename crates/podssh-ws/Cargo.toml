[package]
name = "podssh-ws"
description = "WebSocket framing over a TLS stream, with the TLS and the pure-Rust crypto provider of pod-tls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# TLS: the trust, the configurations, the pure-Rust crypto provider, the
# server's side and Encrypted Client Hello, with podssh's settings (tls.rs).
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.77.0" }
pod-tls = { git = "https://github.com/PodUtils/podcrates", tag = "v0.77.0", features = ["pure", "rsa", "ech"] }
# The dial, the proxies, the race of addresses, Multipath TCP, the HTTP/1.1
# heads, the GET client (sealed with ECH where asked) and STUN's codec, with
# podssh's settings (dial.rs).
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.77.0", features = ["ech"] }
# The resolver: an IP literal, the pins, the system, the cache of addresses
# and DNS over HTTPS, the SRV and HTTPS records (resolve.rs), with its reader
# of ECH lists for pod-tls.
pod-dns = { git = "https://github.com/PodUtils/podcrates", tag = "v0.77.0", features = ["ech"] }
# The WebSocket: the frames, the session, the client of the relay on each
# road (TLS, HTTP/2, cleartext), a URL's WebSocket and the server's side,
# over podssh's way out (client.rs), with ECH.
pod-ws = { git = "https://github.com/PodUtils/podcrates", tag = "v0.77.0", features = ["ech"] }
# The roads out that are not the relay: a second proxy over TLS, the
# forwarders, Wisp, wstunnel, meek_lite, WebTunnel and the Access client of
# Cloudflare (via.rs, forwarder.rs, wstunnel.rs, wisp.rs, meek.rs,
# webtunnel.rs, pt.rs, cloudflare.rs: podssh's way out and words over it);
# VLESS, VMess, Trojan and Shadowsocks (vless.rs, vmess.rs, trojan.rs,
# shadowsocks.rs); EICE and IAP (eice.rs, iap.rs).
pod-egress = { git = "https://github.com/PodUtils/podcrates", tag = "v0.77.0", features = ["via", "forwarder", "wisp", "wstunnel", "meek", "webtunnel", "cloudflare", "vless", "vmess", "trojan", "shadowsocks", "eice", "iap"] }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
# HTTP/2 of an HTTP/2 relay (h2_road/) and of the VLESS stand-ins of the
# tests (tests/vless_support/): h2 and its types, pure Rust, in the lock
# already through the quick tunnel of podssh-relay.
h2 = "0.4.19"
http = "1.5"
bytes = "1.12"
# The tokens of wstunnel and the answers of a forwarder are JSON.
serde_json = { workspace = true }
# frp's messages (frp/msg.rs) and TURN's MESSAGE-INTEGRITY (turn/msg.rs):
# MD5 and SHA-1, pure Rust, in the lock already: md5 0.8 through podssh-ssh,
# sha1 0.11 through podssh-ssh and russh. No `asm` of sha1, which would
# compile assembly.
md5 = { version = "0.8", default-features = false }
sha1 = { version = "0.11", default-features = false }
# frp's control stream (T-498): AES-128 in CFB mode with a key of
# PBKDF2-HMAC-SHA1 (frp/cfb.rs, with the HMAC and SHA-1 above). The block
# cipher alone, pure Rust, in the lock already through podssh-ssh.
aes = { workspace = true }
# The roads over QUIC (tuic/, T-581; hysteria/, T-580): pod-quic's endpoint,
# connection and probe of UDP on noq, the quick tunnel's. Only with the
# feature `quic`, which the binary turns on. BLAKE2b-256 of Hysteria's
# Salamander, pure Rust, in the lock already (0.11, through argon2).
pod-quic = { git = "https://github.com/PodUtils/podcrates", tag = "v0.77.0", optional = true }
blake2 = { version = "0.11", default-features = false, optional = true }

# The clocks of a host that slept (wake.rs): CLOCK_BOOTTIME beside
# CLOCK_MONOTONIC, which Linux alone has. libc compiles no C.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[features]
# A plain WebSocket over TCP to the loopback, for the tests of an embedder
# (podvm) and a stand-in relay (T-068). Off by default; the binary never
# enables it, and the gate checks that with `cargo tree`.
plain-ws = ["pod-ws/plain-ws", "pod-egress/plain-ws"]
# The roads over QUIC where a probe finds that UDP passes (Q82): TUIC (T-581)
# and Hysteria 2 (T-580). No C either.
quic = ["dep:pod-quic", "dep:blake2"]

[dev-dependencies]
pod-testkit = { git = "https://github.com/PodUtils/podcrates", tag = "v0.77.0", features = ["screen"] }
# The doctor is async because it may be asked to perform a handshake, and
# the plants that assert `????` rather than `ok` have to drive it as a caller
# would. `macros` is what makes `#[tokio::test]` exist.
tokio = { workspace = true, features = ["macros", "rt"] }
# The live handshake test drives the same `tokio-rustls` connector the
# library uses, rather than re-deriving one, so what is proven is what ships.
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# The certificates of the tests are minted on P-256, in pure Rust.
# `default-features = false`, as in the workspace: nothing may pull in a C
# toolchain. `getrandom` (the OS's source, no C) gives the tests a secret of
# p256's own `Generate`, which the curves' 0.14 take in place of a rand
# generator; the library draws from rustls's source alone.
p256 = { workspace = true, features = ["getrandom"] }
# The terminal oracle (T-200): a model terminal shows the text that the
# sanitizer leaves, and the cells it takes (tests/terminal_oracle.rs).
vt100 = { workspace = true }
unicode-width = { workspace = true }

# cargo-fuzz builds with `--cfg fuzzing` (`fuzz/`), under which pod-proxy's
# SOCKS5 exchange, private there, is reachable by the fuzzer.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
