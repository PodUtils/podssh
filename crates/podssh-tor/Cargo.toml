[package]
name = "podssh-tor"
description = "Tor through Arti: a stream to a host and port through the Tor network, each first hop through podssh's own dial and proxy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A crate of its own, outside the crates with no C, as podssh-iroh is (the
# operator's ruling Q52): Arti keeps its directory in SQLite, which is C
# (`static-sqlite` builds it in, so the binary needs no libsqlite3). Not a
# default member: a build without the feature `tor` of podssh-cli does not
# compile it.
[dependencies]
# No default features: no native-tls (OpenSSL), and no compression of the
# directory (zstd and xz are C); `rustls` takes the process's provider, which
# podssh-cli makes podssh-ws's own. 0.x: a new minor version is a change of
# API to read, so the range ends before 0.49. `pt-client` (T-385): bridges,
# and a transport that Arti does not manage, which this crate's runtime
# answers in the process (`transport.rs`); it adds tor-ptmgr, Rust alone (its
# manifest read at 0.47.0), whose launcher of programs runs only for a
# transport with a `path`, which podssh never writes and refuses.
# `onion-service-client` and `onion-service-service` (T-578): onion
# services, a node's and a client's, Rust alone (tor-hsclient, tor-hsservice,
# and the keystore of tor-keymgr; read at 0.48.0). `restricted-discovery` and
# `experimental-api`, which Arti marks experimental: a service that lists the
# keys of its clients, and a client that puts its key in its keystore.
arti-client = { version = ">=0.48, <0.49", default-features = false, features = [
  "tokio", "rustls", "static-sqlite", "pt-client",
  "onion-service-client", "onion-service-service", "restricted-discovery", "experimental-api",
] }
# The onion service's parts that arti-client does not re-export: the
# requests of its clients, their streams, and the keys of restricted
# discovery. The versions that arti-client builds.
tor-hsservice = { version = ">=0.48, <0.49", default-features = false, features = ["restricted-discovery"] }
tor-hscrypto = { version = ">=0.48, <0.49", default-features = false }
tor-proto = { version = ">=0.48, <0.49", default-features = false, features = ["hs-service"] }
tor-cell = { version = ">=0.48, <0.49", default-features = false }
tor-llcrypto = { version = ">=0.48, <0.49", default-features = false }
# The display of an onion address in full, which Arti redacts in its logs.
safelog = { version = "0.10", default-features = false }
# The runtime's parts: the TCP provider that dials through podssh-ws, in the
# version that arti-client builds.
tor-rtcompat = { version = ">=0.48, <0.49", default-features = false, features = ["tokio", "rustls"] }
# The pattern of an address and a port that a first hop may have, and the
# kind of Arti's errors: the versions that arti-client builds.
tor-netdoc = { version = ">=0.48, <0.49", default-features = false }
tor-error = { version = ">=0.48, <0.49", default-features = false }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { workspace = true }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
podssh-ws = { path = "../podssh-ws" }
# Another Tor network's configuration, as chutney writes it, read into
# Arti's builder (its tests run against a private network of C tor).
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Arti's own client of a transport that it does not manage (T-385), driven
# against this crate's runtime in `tests/transports.rs`: the SOCKS5 handshake
# and its encoding of a bridge's arguments are Arti's, not a copy of them.
# The versions that arti-client builds.
tor-chanmgr = { version = ">=0.48, <0.49", default-features = false, features = ["pt-client"] }
tor-linkspec = { version = ">=0.48, <0.49", default-features = false, features = ["pt-client"] }
tor-llcrypto = { version = ">=0.48, <0.49", default-features = false }
tor-socksproto = { version = ">=0.48, <0.49", default-features = false }
