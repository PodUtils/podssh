[package]
name = "podssh-relay"
description = "Reaching podssh's WebSocket-to-TCP relay: relay hosts and failover, tokens, forward sessions. No C compiler needed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A library other projects (podvm) use; its crates move to PodUtils/podcrates
# (T-684).
[dependencies]
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0" }
pod-identity = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0" }
# The relay client: the hosts, the pool, the rank, the failover, the tokens,
# the roads to a relay, the pairs, the grants, the reverse road and the
# blocking facade (PodUtils/podcrates@T-025): pod-relay, over podssh's
# process context (src/context.rs). The dialer of a node's targets is
# pod-proxy's, with podssh's settings (podssh-ws's dial.rs).
pod-relay = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0" }
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0" }
# The services of other parties: the relay's host, limits and seed, the
# DERP servers, Piping, the mailboxes and transit, OpenTunnel, the edge of
# the quick tunnel and its roots.
pod-services = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0" }
podssh-ws = { path = "../podssh-ws" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
# The resumable layer (src/session/), UDP in a stream (src/udp/), the link
# over a WebSocket (src/transit/link.rs) and the rule of a peer's answer
# (src/answer.rs): pod-session of PodUtils/podcrates (T-020 there).
pod-session = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0" }
# SHA-256, HMAC-SHA-256 and HKDF of the tokens, the mailbox and croc, and
# X25519 of the key of DERP. Pure Rust, as in podssh-ws.
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
x25519-dalek = { workspace = true }
# The identity of each end (src/identity/, T-087): an Ed25519 key, shown by
# its SHA256 fingerprint in base64 as OpenSSH shows one. Pure Rust.
ed25519-dalek = { workspace = true, features = ["zeroize"] }
base64 = { workspace = true }
# The channel between two podssh ends (src/e2e/, T-088): Noise XX on snow,
# pure Rust: pod-e2e of PodUtils/podcrates (T-021 there).
pod-e2e = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0" }
# A quick tunnel's connection to Cloudflare's edge (src/quick/serve.rs, T-300):
# the edge is the client of HTTP/2 on the connection that podssh dialed. Pure
# Rust, in the lock already through hyper; only with the features `quick`,
# `piping` and `serve`, whose relay role serves HTTP/2 (T-321).
h2 = { version = "0.4.19", optional = true }
http = { version = "1.5", optional = true }
bytes = { version = "1.12", optional = true }
# The quick tunnel over QUIC (src/quick/quic.rs, T-301): noq, the QUIC of the
# iroh road, with its tokio runtime and its rustls glue only: no ring and no
# aws-lc, as its manifest makes them optional. QUIC's keys come from
# podssh-ws's provider; rustls for the TLS 1.3 configuration of QUIC.
noq = { version = "1.4", default-features = false, features = ["runtime-tokio", "rustls"], optional = true }
rustls = { workspace = true, optional = true }
# The QUIC endpoint, its keys, the connection within its wait, the race of
# handshakes and the probe of UDP (PodUtils/podcrates, T-019): pod-quic, on
# the same noq.
pod-quic = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0", optional = true }
# DERP's handshake (src/derp/, T-349): the client's info sealed to the
# server's key with NaCl's crypto_box (X25519, XSalsa20, Poly1305). Pure
# Rust, RustCrypto's, in the lock already through the vendored tailscale-rs;
# no `getrandom`: a nonce comes from podssh's own source.
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "salsa20"], optional = true }
# Yggdrasil's router (T-735): Ironwood of Revertron/Yggdrasil-ng, MPL-2.0,
# pure Rust, pinned by its commit; the link, the handshake and the key's
# transform are podssh's own (src/ygg/). ed25519-dalek and blake2 for the
# handshake's signature, which Ironwood's keys take.
ironwood = { git = "https://github.com/Revertron/Yggdrasil-ng", rev = "c3a3aa6", optional = true }
blake2 = { version = "0.10", optional = true }
# HyperDHT where UDP passes (T-736): peeroxide, a port of Hyperswarm in pure
# Rust (MIT OR Apache-2.0), pinned to its release with peeroxide-dht and libudx.
peeroxide = { version = "=1.7.4", optional = true }
# The Piping Server road (src/piping/, T-437): TLS that offers HTTP/2 and
# HTTP/1.1 by ALPN, on podssh-ws's provider and trust store; the async
# wrapper of rustls that podssh-ws builds, with no provider of its own.
tokio-rustls = { workspace = true, optional = true }
# The quick tunnel's edge inside WARP's tunnel (src/quick/edge_warp.rs,
# T-374): a TCP stream to the edge's port 7844 on podssh-warp's road (T-352),
# pure Rust; only with the feature `warp`.
podssh-warp = { path = "../podssh-warp", optional = true }
# Pairing by a short code (src/code/, T-086): the mailbox client, SPAKE2, the
# sealed phases and the words of a code, which podssh gives its AppID, its
# name and its way out; only with the feature `code`.
pod-wormhole = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0", optional = true }
# croc's relay road (src/croc/, T-694): the curve SIEC of croc's relay
# handshake, which no crate implements, on num-bigint's integers (0.5 since
# T-754), and AES-256-GCM of croc's crypt, the workspace's.
# Pure Rust; only with the feature `croc`.
num-bigint = { version = "0.5", optional = true }
aes-gcm = { workspace = true, optional = true }

[features]
# Pairs of the reverse road: `POST /v1/pair`, the status of a pair and
# `POST /v1/stop/<name>` (T-078), and the node and operator runners (T-079,
# T-080). No C either; the gate builds it.
pair = ["pod-relay/pair"]
# A synchronous facade over pairs, the runners and forward sessions, for a
# caller with no async runtime (podvm, T-081). No C either; the gate builds it.
blocking = ["pair", "pod-relay/blocking"]
# A quick tunnel that podssh serves itself (T-300): HTTP/2 to the edge, and
# QUIC where UDP reaches it (T-301). No C either; the gate builds it.
quick = ["dep:h2", "dep:http", "dep:bytes", "dep:noq", "dep:rustls", "dep:pod-quic"]
# QUIC on UDP to podssh's relay role (T-667): the client's race of QUIC and
# its TCP roads after the quick tunnel's probe of UDP, and with `serve` the
# role's QUIC endpoint. noq and the probe are the quick tunnel's, so no crate
# is added. No C either; the gate builds it.
quic = ["quick", "pod-relay/quic"]
# The DERP road (T-349): Tailscale's servers for tailcat, or a derper of the
# user's own, under the resumable layer, with an adapter that sends again
# what a server drops. No C either; the gate builds it.
derp = ["dep:crypto_box"]
# Tox's TCP relays (T-734): its boxes are NaCl's, the crate of derp. No C.
tox = ["dep:crypto_box"]
# Yggdrasil's road (T-735).
yggdrasil = ["dep:ironwood", "dep:blake2"]
# HyperDHT's road where UDP passes (T-736).
hyperdht = ["dep:peeroxide"]
# Syncthing's relays on 443 as a last road (T-571): rustls with the
# provider of podssh-ws, a certificate of the pair's made here.
strelay = ["dep:rustls", "dep:tokio-rustls"]
# The Piping Server road (T-437): a POST and a GET of a Piping Server for each
# way of a link, over HTTP/2 or HTTP/1.1, under the resumable layer, for a
# proxy that refuses the WebSocket upgrade. No C either; the gate builds it.
piping = ["dep:h2", "dep:http", "dep:bytes", "dep:rustls", "dep:tokio-rustls"]
# The OpenTunnel road (T-530): a blind TLS tunnel with no account, whose
# bridge is a WebSocket through `HTTPS_PROXY` and whose client's leg is TLS by
# name on port 443, under the resumable layer; the key and the CSR of its
# name come from the binary. No C either; the gate builds it.
opentunnel = []
# The Pinggy road (T-548): a last fallback of Q78 through Pinggy's free TLS
# tunnels, whose client's leg is TLS by name on port 443 and whose node ends
# each visitor's TLS with a certificate of its own key; the dials of the
# OpenTunnel road, and rustls for the client's verifier that pins that key,
# as no CA signs it. The node's SSH client is the binary's.
# No C either; the gate builds it.
pinggy = ["opentunnel", "dep:rustls"]
# The Serveo road (T-549): a last fallback of Q78 through Serveo's private
# aliases, whose node's and client's legs are both SSH, the binary's; the
# Pinggy road's far end and switches, with no TLS. No C either.
serveo = ["pinggy"]
# A tunnel of HTTP made by `ssh -R` (T-565): a last fallback of Q78 through
# localhost.run, whose node's leg is SSH (the binary's) and whose visitors'
# plain HTTP is a WebSocket of the layer, as a quick tunnel's, or a request
# of the relay role; the Pinggy road's switches and its reading of names.
# No C either.
ssh-http = ["quick", "pinggy"]
# The localtunnel road (T-568): a last fallback of Q78 through localtunnel's
# public server, whose node asks for a tunnel over HTTPS and serves each of
# its TCP connections with the relay role (`serve`) and the quick tunnel's
# reader of a visitor's WebSocket (`quick`), with the Pinggy road's switches
# and the OpenTunnel road's dials (`pinggy`). No C either; the gate builds it.
localtunnel = ["serve", "quick", "pinggy"]
# The bore road (T-569): a last fallback of Q78 through bore.pub, a public
# TCP port of bore's protocol (JSON frames on the control port 7835) at a
# port of the node's key, whose client reaches it raw, through the caller's
# roads; the Pinggy road's far end and switches, with no TLS. No C either.
bore = ["pinggy"]
# The quick tunnel's edge inside WARP's tunnel (T-374), for a node whose cage
# reaches TCP port 7844 only through it. No C either; Rust 1.91.
warp = ["quick", "dep:podssh-warp"]
# The same with podssh-warp's stand-in of WARP's edge, which listens on the
# loopback, for tests/quick_edge_warp.rs alone; the binary never enables it.
warp-stand-in = ["warp", "podssh-warp/stand-in"]
# Grants used once (T-226): the reader and the writer of an OpenSSH user
# certificate of an Ed25519 key, the node's check of one, and its record of
# each grant used. Pure Rust, with the crates of `identity`; the channel
# carries a grant's bytes with or without it. No C either; the gate builds it.
grant = ["pod-relay/grant"]
# The relay as a role of podssh (T-169, Q63): the forward road of the
# relay's contract, served, and its reverse road (T-427), which reads and
# writes the frames with the node's own codecs of `pair`; the caller owns the
# listener and TLS. Its mailbox for the pairing by a short code (T-086) needs
# no crypto of its own. Its HTTP/2 with extended CONNECT (T-321) is h2's
# server, which `quick` builds already. No C either; the gate builds it.
serve = ["pair", "dep:h2", "dep:http", "dep:bytes"]
# Pairing by a short code (T-086): magic-wormhole's mailbox protocol, SPAKE2
# keyed by the code, then its phases in NaCl's SecretBox, which carry the
# operator's part of a pair and each end's key. No C either; the gate builds it.
code = ["pair", "dep:pod-wormhole", "pod-relay/code"]
# croc's relay road (T-694): croc's public relays through the WebSocket
# bridge of croc-web, a last fallback of Q78, under the resumable layer;
# its PAKE on SIEC, written here. No C either; the gate builds it.
croc = ["dep:num-bigint", "dep:aes-gcm"]
# Plain ws:// to a stand-in relay on the loopback, for the tests of an embedder
# (T-068). The binary never enables it (scripts/no-plain-ws.sh).
plain-ws = ["podssh-ws/plain-ws", "pod-relay/plain-ws"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The owner and the access list of a private file, and the files and
# directories that podssh makes with an access list of their own (T-274).
# Bindings with no C code (windows-link's raw-dylib), the version that tokio
# pulls in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
# `test-util` gives the tests a paused clock: the heartbeat's 200 s of idle
# time pass at once (T-154).
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# Property tests of relay lists and paths (T-202, tests/properties.rs).
proptest = { workspace = true }
# The stand-in edge of the quick tunnel over QUIC (tests/quick_tunnel_quic.rs,
# T-301): its certificate, made by rcgen with no crypto feature and signed by
# a P-256 key of p256, so that the test builds with no C compiler; its
# `getrandom` (the OS's source, no C) draws that key through p256's own
# `Generate`.
rcgen = { version = "0.14", default-features = false }
p256 = { workspace = true, features = ["getrandom"] }
# The stand-in edge's TLS in tests/quick_edge_warp.rs (T-374): the version
# that podssh-ws builds.
tokio-rustls = { workspace = true }
