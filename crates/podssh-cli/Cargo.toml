[package]
name = "podssh-cli"
description = "Argument parsing, subcommand dispatch, the doctor command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "podssh"
path = "src/main.rs"

[lib]
name = "podssh_cli"
path = "src/lib.rs"

[features]
default = []
# `podssh ts`: the Tailscale adapter over the vendored tailscale-rs fork.
# Off by default because the fork needs a C compiler and cmake (aws-lc-sys)
# and dominates build time, memory and binary size. Without it, `podssh ts`
# still parses and refuses with a message naming this feature.
ts = ["dep:podssh-ts"]
# The iroh road between two podssh ends (T-162), over pod-iroh of
# PodUtils/podcrates. Off by default: iroh adds about 200 crates, and the
# road is one that the user selects. With it, `podssh relay serve
# --relay-roads iroh` serves iroh's relay protocol too (T-720).
iroh = ["dep:pod-iroh", "dep:iroh", "dep:pod-ws", "podssh-relay/iroh-serve"]
# The iroh road with a relay server on the loopback, for the test of the
# command line from end to end (`tests/iroh_road.rs`); never in a release.
iroh-test = ["iroh", "pod-iroh/test-relay"]
# WARP's MASQUE road over HTTP/2 (T-352, the operator's ruling Q52):
# `warp://HOST[:PORT]`. Off by default, as a trial: pure Rust, but smoltcp
# needs Rust 1.91, and the road waits for its live run (T-352's Prove).
# Without it, a warp:// destination is refused with exit 70. With it, the
# quick tunnel's node reaches the edge inside WARP's tunnel too (T-374).
# And over HTTP/3 where UDP passes (T-582), on the pod-quic that `quic` of
# podssh-ws builds already.
warp = ["dep:podssh-warp", "podssh-relay/warp"]
# Tor through Arti (T-353, the operator's ruling Q52): `tor://HOST[:PORT]`.
# Off by default: Arti adds about 500 crates, SQLite's C and Rust 1.92, and
# its live test waits for Q60. Without it, a tor:// destination is refused
# with exit 70.
tor = ["dep:pod-tor"]
# ZeroTier's road of a pair (T-733), a last fallback of Q78: ZeroTierOne's
# MPL-2.0 core in C++, linked statically. Off by default until its static
# musl build is measured; without it, the road is not there.
zerotier = ["dep:podssh-zerotier"]
# The Dev Tunnels forward road (T-755): `devtunnel://TUNNEL[:PORT]`, a
# `direct-tcpip` channel to a port of a Microsoft Dev Tunnels host through
# its relay on 443, over pod-devtunnel. Off by default, as a trial until its
# live run with a tester's tunnel; its russh brings ring beside aws-lc-rs.
# Without it, a devtunnel:// destination and doctor --devtunnel are refused
# with exit 70.
devtunnel = ["podssh-relay/devtunnel"]
# Tox's TCP relays as a last road of a pair (T-734). No C.
tox = ["podssh-relay/tox"]
# Yggdrasil's network as a last road of a pair (T-735). No C.
yggdrasil = ["podssh-relay/yggdrasil"]
# HyperDHT where UDP passes, as a road of a pair (T-736). No C.
hyperdht = ["podssh-relay/hyperdht"]
# Syncthing's relays on 443 as a last road of a pair (T-571). No C.
strelay = ["podssh-relay/strelay"]
# Public file hosts with a public MQTT broker as the last of the last roads
# of a pair (T-738, Q78). podssh-relay's module is in each build (feature
# `filehost` there, pure Rust, aes-gcm as croc's); this switch turns the road
# on. Off by default until its live run through each host passed. No C.
filehost = []
# The GSRN road by a shared secret (T-707): `podssh node --gsr` and a last
# road of `podssh ssh node://NAME`, over pod-gsr (PodUtils/podcrates), whose
# TLS with SRP is OpenSSL built from source and linked static (rustls has
# none). Off by default: a C compiler and perl build OpenSSL, and the road
# waits for its live run. Without it, --gsr and --gsr-secret-file are
# refused with exit 70.
gsr = ["dep:podssh-gsr"]
# The road with the stand-in relay and root on the loopback, for the test of
# the command line from end to end (`tests/derp_road.rs`); never in a release.
zerotier-test = ["zerotier", "podssh-zerotier/stand-in"]

# Each dependency is one that the library uses: `unused_crate_dependencies`
# is denied in src/lib.rs, so a dependency that no code uses fails the build.
[dependencies]
podssh-probe = { path = "../podssh-probe" }
podssh-ts = { path = "../podssh-ts", optional = true }
podssh-warp = { path = "../podssh-warp", optional = true }
pod-tor = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0", optional = true }
podssh-zerotier = { path = "../podssh-zerotier", optional = true }
podssh-gsr = { path = "../podssh-gsr", optional = true }
# The iroh road (T-162): an endpoint as podssh sets up its other roads,
# with podssh's TLS context, resolver, proxy and way out, which this crate
# gives it (`src/iroh_way.rs`). It reads no variable: podssh reads its
# PODSSH_IROH_* and gives the values.
pod-iroh = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0", optional = true }
# The way out of each request of the iroh road (`/ping`, pkarr, the question
# of the version): the type of `podssh_ws::client::way`, the pod-ws that
# podssh-ws builds.
pod-ws = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0", optional = true }
# The types of the iroh road (a relay's URL, an endpoint, a key); the
# version that pod-iroh builds, and its range (T-359). No TLS feature:
# pod-iroh takes `tls-ring`, and the endpoint takes podssh's provider.
iroh = { version = ">=1.4.1, <1.5", default-features = false, optional = true }
# `quic`: the roads over QUIC where UDP passes, `--tuic` (T-581) and
# `--hysteria` (T-580), on the pod-quic and noq that podssh-relay's quick
# tunnel builds in each build; pure Rust.
podssh-ws = { path = "../podssh-ws", features = ["quic"] }
# The services of other parties: the facts of doctor's checks, STUN, the
# DERP map, the zone of OpenTunnel, the ACME directory, the relay of
# `podssh ts`.
pod-services = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0" }
# The ACME client of `relay serve --acme` (src/acme/): pod-acme of
# PodUtils/podcrates (T-034 there); pod-core for the type of its lines.
pod-acme = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0" }
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0" }
# The model of the help and the manual that each command line of PodUtils
# shares, and its checks of drift (T-790): podssh's manual fills it
# (src/man/pod_model.rs). Pure Rust; libc for its pager alone.
pod-manual = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0" }
# `podssh update` (T-850, T-880 of podcrates): the release's signature, its
# files, the replace of the running binary and the way back; `fetch` for the
# steps over pod-proxy's client with podssh's way out.
pod-release = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0", features = ["fetch"] }
# The leaf of a certificate that `podssh status` reads: no C, as its feature
# `verify` (ring) is off.
x509-parser = { version = "0.18", default-features = false }
# The trait of podssh-ws's signature checks, for that bundle.
rustls = { workspace = true }
# Relay hosts and failover, tokens, forward sessions (C-free, shared with podvm).
# `derp`: the DERP road of `podssh node --derp` and `podssh ssh derp:` (T-379),
# pure Rust, in each build, as the operator's ruling Q50 makes it a fallback.
# `piping`: the Piping Server road of `podssh node` and `podssh ssh node://`
# (T-437), pure Rust, in each build, as the operator's ruling Q65 makes it a
# fallback for a proxy that refuses the WebSocket upgrade. `opentunnel`: the
# OpenTunnel road of `podssh node --opentunnel` and `podssh ssh node://`
# (T-531), pure Rust, in each build, as the operator's ruling Q76 makes it a
# fallback of a node with no other road. `pinggy`: the Pinggy road of
# `podssh node --pinggy` and `podssh ssh node://` (T-548), pure Rust in
# podssh-relay (its SSH leg is podssh-ssh's russh, here), in each build, as
# the operator's ruling Q78 makes it a last fallback. `serveo`: the Serveo
# road of `podssh node --serveo` and `podssh ssh node://` (T-549), the last
# fallback of Q78, whose SSH legs are podssh-ssh's russh, here, in each build.
# `grant`: grants used once (T-226),
# which each node checks, pure Rust, in each build. `code`: pairing by a
# short code (T-086), `podssh relay pair --code` and `podssh relay join`,
# SPAKE2 and NaCl's SecretBox in pure Rust, in each build. `croc`: croc's
# relay road of a pair (T-694), its PAKE on SIEC in pure Rust, a last
# fallback of Q78, in each build. `ssh-http`: the road of a tunnel of HTTP
# made by `ssh -R` (T-565), localhost.run's, a last fallback of Q78 too,
# whose SSH leg is podssh-ssh's russh, here, in each build. `localtunnel`:
# the localtunnel road of `podssh node --localtunnel` and `podssh ssh
# node://` (T-568), a last fallback of Q78, pure Rust, in each build.
# `hostc`: the hostc road of `podssh node --hostc` (T-742), a last fallback
# of Q78, hostc's protocol over one WebSocket, pure Rust, in each build.
# `bore`: the bore road of `podssh node --bore` and `podssh ssh node://`
# (T-569), the last fallback of Q78, raw TCP of bore's protocol, in each
# build. `smee`: the smee.io road of `podssh node` and `podssh ssh node://`
# (T-741), a last fallback of Q78, pure Rust over the Piping Server road's
# HTTP/1.1, in each build. `hostc`: the hostc road of `podssh node` (T-742),
# a last fallback of Q78 over the `ssh -R` road's HTTP visitors.
podssh-relay = { path = "../podssh-relay", features = ["pair", "quick", "quic", "derp", "serve", "piping", "opentunnel", "pinggy", "serveo", "grant", "code", "croc", "ssh-http", "localtunnel", "hostc", "bore", "smee", "filehost", "bucket"] }
# The native SSH client. It needs a C compiler (russh with aws-lc-rs); the
# operator accepted that for the binary on 2026-10-08.
podssh-ssh = { path = "../podssh-ssh" }
# The JWT of a service account's key for IAP (T-351), signed RS256 in
# aws-lc-rs, whose RSA is constant-time, never with the `rsa` crate
# (RUSTSEC-2023-0071): the version and features that podssh-ssh builds, so
# nothing new is compiled. ACME's keys are pod-acme's, of p256.
aws-lc-rs = "1.16.2"
# `signal`: `podssh node` stops on Ctrl-C and SIGTERM.
tokio = { workspace = true, features = ["signal", "process", "fs"] }
serde_json = { workspace = true }
# The protocol of `podssh chat` between two podssh ends (T-099), with no I/O.
podssh-core = { path = "../podssh-core" }
# %C of the ssh_config tokens is SHA-1, as OpenSSH computes it; the version
# podssh-ssh already builds.
sha1 = { version = "0.11", default-features = false }
# `cp` compares the SHA-256 of both ends (T-134); the version the workspace
# already builds.
sha2 = { workspace = true }
# The random part of `cp`'s temporary names: the workspace's rand, as
# podssh-ssh's, so nothing new is compiled.
rand = { workspace = true }
# The copy by exec carries bytes as base64 where a channel changes them
# (T-135); the version podssh-ssh already builds.
base64 = { workspace = true }

# The relay token is wiped from memory when dropped.
zeroize = { workspace = true }
# The stream of an agent's clients that russh's agent server reads (T-034);
# russh pulls it in already.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# `podssh session` (T-186): where a kept stream of output may start, and its
# ring (the grammar of T-221), and when the output has stopped.
pod-term = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0" }
# `podssh session capture`: the screen that a terminal shows after the
# session's output. The model of the terminal oracle (T-200), pure Rust over
# vte, with no build script that compiles C; the lock has it already.
vt100 = { workspace = true }
# `podssh config import mremoteng` (T-327): the XML of mRemoteNG's
# connections, as a read-only tree; pure Rust, whose one dependency
# (memchr) the lock has already (T-292's Decision).
roxmltree = { version = "0.21", default-features = false }

# MEASURED 2026-10-02, this machine (Git Bash on Windows) and in
# `rust:1-alpine` via `sh scripts/dev.sh run`:
#   curl -sS 'https://crates.io/api/v1/crates/clap'            -> max_version 4.6.7
#   curl -sS 'https://index.crates.io/cl/ap/clap'              -> 4.6.7, rust_version 1.85
#   CC=/nonexistent cargo build -p podssh-cli                  -> exit 0
# `suggestions` is ON and it is the reason for the dependency: it is what pulls
# `strsim` in, and `strsim` is a Damerau-Levenshtein implementation. A hand-rolled
# edit distance was measured to be wrong for `example.org`; this is
# the library doing it instead.
#
# `wrap_help` is OFF on purpose. It pulls `terminal_size`, which is a
# terminal probe — and `AGENTS.md` (section 5, rule 1) forbids depending on a capability
# that has not been probed. Podssh renders `--help` at a fixed 100 columns, which is what
# makes the man/help parity check a string comparison rather than a guess.
clap = { version = "4.6.7", default-features = false, features = [
  "std", "help", "usage", "error-context", "suggestions", "derive",
] }

# The calls into the C library are in code for Unix only (the probes of
# doctor, the ids of the ssh_config tokens).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# AF_UNIX on Windows for `podssh pipe unix-connect:` (T-176), which the
# standard library has not, the user of a listener's peer (T-177), and a
# file's index, which finds its hard links (T-146): the version and, for the
# file system, the feature that tokio and podssh-ssh build. The standard
# handles of a session daemon that leaves its starter (T-186): the console's
# feature, which podssh-ssh builds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    # The job that ends a node's next binary with the one before it (T-678).
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
pod-testkit = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0", features = ["screen"] }
# `test-util` gives the tests a paused clock: the limit of a stuck write is
# 60 s (tests/direct_write_limit.rs).
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# An SSH server for a node's TARGET in `tests/iroh_road.rs`; the version and
# the features that podssh-ssh builds, so no crate is added.
russh = { version = "0.65.2", default-features = false, features = ["aws-lc-rs", "rsa", "flate2"] }
# The terminal oracle (T-200) of `tests/silent_notice.rs` (T-302): the
# model terminal that the tests of podssh-ssh run, so no crate is added.
vt100 = { workspace = true }
# The stand-in release of `tests/update.rs` (T-375): its certificates, of
# its own Fulcio and of its TLS server, made by rcgen with no crypto feature
# (pod-acme takes it too) and signed by P-256 keys of p256, as podssh-relay's
# tests make theirs, so that no C is compiled; the server's TLS, of
# tokio-rustls, which podssh-ws builds. The lock has each one.
rcgen = { version = "0.14", default-features = false }
p256 = { workspace = true, features = ["getrandom"] }
tokio-rustls = { workspace = true }
# The stand-in DERP server of `tests/derp_road.rs` (T-379): pod-derp's own
# (its feature `standin`), which opens the client's info with NaCl's box.
pod-derp = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0", features = ["standin"] }
# The stand-in of the S3 API of `tests/carrier_s3.rs` (T-725): pod-link's
# own (its feature `s3-standin`), which checks each request's SigV4; the
# crate that podssh-relay's `bucket` builds already.
pod-link = { git = "https://github.com/PodUtils/podcrates", tag = "v0.79.0", features = ["s3-standin"] }

# The pseudo console of `tests/console.rs` (T-132): the version above, with
# the console's functions, which podssh-ssh builds too; and the job objects of
# `tests/detach_windows.rs` (T-383).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects",
    # The named event that asks a node's upgrade (T-678).
    "Win32_System_Threading",
] }
