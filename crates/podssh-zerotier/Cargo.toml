[package]
name = "podssh-zerotier"
description = "ZeroTier's MPL-2.0 core, vendored and linked statically, for a last road of a podssh pair through ZeroTier's roots and TCP relay (T-733)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A crate of its own, outside the default members, as podssh-tor is: it
# compiles C++ (rule 4 allows it; the binary stays static). The feature
# `zerotier` of podssh-cli builds it.
[features]
# A stand-in of the TCP relay and of a planet's root on the loopback, for the
# tests of the road from end to end; never in a release.
stand-in = ["tokio/net"]

[dependencies]
libc = { workspace = true }
# TCP over the network's frames: the userspace stack of smoltcp, with its
# listener.
pod-netstack = { git = "https://github.com/PodUtils/podcrates", tag = "v0.42.0" }
sha2 = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread"] }
# The relay of the live run, as podssh names no host of a third party.
pod-services = { git = "https://github.com/PodUtils/podcrates", tag = "v0.42.0" }
