[package]
name = "podssh-ssh"
description = "The native SSH client behind `podssh ssh`: russh over a relay or TCP stream, with podssh's host-key, authentication and terminal handling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# This crate needs a C compiler: russh's crypto backend is aws-lc-rs
# (aws-lc-sys). Operator decision 2026-10-08. `default-features = false` keeps the
# backend choice explicit: `aws-lc-rs`, plus RSA keys and zlib compression
# (flate2's default backend is pure Rust).
[dependencies]
russh = { version = "0.65.4", default-features = false, features = ["aws-lc-rs", "rsa", "flate2"] }
podssh-ws = { path = "../podssh-ws" }
# fs: a descriptor that a control client passes and epoll does not take
# (a regular file) is read and written on tokio's blocking threads (T-039).
tokio = { workspace = true, features = ["signal", "process", "fs"] }
zeroize = { workspace = true }
base64 = { workspace = true }
# The hashed names of known_hosts, HMAC-SHA1: sha1 0.11 with the workspace's
# hmac 0.13, the line of digest 0.11 that russh builds on (T-330, T-386).
hmac = { workspace = true }
sha1 = { version = "0.11", default-features = false }
# Key generation (`podssh keygen`): the thread generator russh itself uses for
# keys, seeded from the operating system; the workspace's rand is russh's
# version, so nothing new is compiled.
rand = { workspace = true }
# The atomic replace of a file that keeps its mode, for the rewrite of
# known_hosts (`pod_core::files::replace`, T-820): the tag of every
# podcrates crate.
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0" }
# The certificate of a login of serve's gateway (T-903): pod-relay's `Mint`
# with the extensions of OpenSSH (feature `grant`), signed by the route's
# Ed25519 CA as a pod-identity `Identity`. Both are in the tree already,
# through podssh-relay; the feature adds no crate.
pod-relay = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0", features = ["grant"] }
pod-identity = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0" }
# SFTP version 3 (T-133): pure Rust, Apache-2.0, a limit on each request, and
# requests in flight together. Its one optional feature (async-trait) is off.
russh-sftp = { version = "3.0.1", default-features = false }
# The buffer type of russh-sftp's codec, which the SFTP server of `podssh
# serve` reads and writes (T-112). The version that russh-sftp and russh
# pull in, so nothing new is compiled.
bytes = "1.12.1"
# The channels of -L and -D open at the same time (T-038): the version that
# russh pulls in, so nothing new is compiled.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# RSA signatures and RSA keys through aws-lc-rs, whose RSA is constant-time
# (T-257); the `rsa` crate's private-key operations are not
# (RUSTSEC-2023-0071). The version and features that russh pulls in.
aws-lc-rs = "1.16.2"
# The CRT exponents of an OpenSSH RSA key, d mod (p - 1) and d mod (q - 1),
# in constant time, for its PKCS#1 form (T-257). The features that `rsa`
# asks for, so nothing new is compiled.
crypto-bigint = { version = "0.7.3", default-features = false, features = ["alloc", "zeroize"] }
# A PEM key that OpenSSL encrypted, opened as OpenSSL encrypted it (T-287):
# its key from MD5 of the passphrase, and AES or Triple DES in CBC mode. The
# versions that russh pulls in, so nothing new is compiled.
aes = "0.9"
cbc = "0.2"
des = "0.9"
md5 = "0.8"
# An encrypted key of PKCS#8 (T-287), opened by russh through `pkcs5`: these
# features turn on the schemes of OpenSSH's `ssh-keygen -m PKCS8` (PBKDF2
# with HMAC-SHA1) and of OpenSSL's `-v2 des3` (Triple DES), to read keys and
# never to write them; `pkcs8` reads the scheme before the question. The
# versions that russh pulls in, and the `sha1` and `des` that the tree has.
pkcs5 = { version = "0.8.1", default-features = false, features = ["sha1-insecure", "3des"] }
pkcs8 = { version = "0.11", default-features = false, features = ["encryption"] }
# SSH signatures (T-020): the digest of a file read in pieces, and the times
# of an allowed-signers file, which are local unless they end in Z; and the
# times of sftp's long listing. jiff, as chrono is unmaintained
# (RUSTSEC-2026-0543, T-808): it reads the system's time zone with no
# unsound call, and on Windows its bundled database.
sha2 = { workspace = true }
# The ECDSA P-256 signature of a TPM's policy (T-839), made by p256 itself.
p256 = { workspace = true }
jiff = "1.0.0"
# The signer that ssh-key's certificate builder calls (T-021): an RSA CA
# signs through aws-lc-rs, and a CA in an agent through the agent. The
# version that ssh-key builds.
signature = { version = "3", default-features = false }
# The size rules of an algorithm policy, JSON in ssh-audit's grammar, and
# the verdict as JSON (T-838): the version that the workspace has.
serde_json = { workspace = true }
# Local echo for high latency (T-160): the client's model of the far end's
# screen, which its guesses are judged against and drawn over. The model of
# the terminal oracle (T-200), pure Rust over vte; the lock has it already.
vt100 = { workspace = true }
# serve's line discipline where no pty opens (T-111): the cooked mode of
# PodUtils/podcrates' pod-term, the tag of every podcrates crate. On each
# target: a kept shell's ring (T-159) is built on Windows too, and the crate
# is bytes only. `transfer`: the 7-bit envelope's codec, whose near end the
# session's watch runs and whose far end `podssh tx` runs (T-831).
pod-term = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0", features = ["transfer"] }
# Keys sealed to the machine (T-839, PodUtils/podssh#351): PodUtils/podcrates'
# pod-tpm, the codec, the key file, the sequences, and the transports of the
# device of a Unix kernel and of swtpm's socket (`device`); pure Rust, no C.
# Not its `tbs`: its TBS of Windows imports tbs.dll at the start of the
# process and bounds no command, where podssh's (src/tpm/windows.rs) loads
# it at run time and cancels a command after 30 s (T-839's Decision).
pod-tpm = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0", features = ["device"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Security keys (T-229): the WebAuthn API of Windows (webauthn.dll), loaded
# at run time through the library loader, and the window that owns its
# dialog. Keys sealed to a TPM (T-839): the types of the TPM Base Services
# (tbs.dll), loaded the same way. The version above, so no crate is added.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_TpmBaseServices",
    "Win32_UI_WindowsAndMessaging",
] }
# Whether Pageant runs (T-228): russh's stream to Pageant opens when none
# does, and closes at the first request. The version that russh pulls in, so
# nothing new is compiled.
pageant = { version = "0.2.4", default-features = false, features = ["wmmessage"] }

[dev-dependencies]
pod-testkit = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0", features = ["screen"] }
# The TPM in software of pod-tpm, for the tests of the glue of src/tpm.
pod-tpm = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0", features = ["device", "soft"] }
# `test-util` gives the tests a paused clock: a hop's 10 s of silence (T-462)
# and the relay's idle cut at 180 s (T-463) pass at once.
tokio = { workspace = true, features = ["macros", "rt", "signal", "process", "test-util"] }
# The terminal oracle (T-200): a model terminal in raw mode shows podssh's
# messages and the help of `~?` (tests/terminal_oracle.rs).
vt100 = { workspace = true }
# Property tests of `known_hosts` patterns and the escape filter (T-202,
# tests/properties.rs).
proptest = { workspace = true }

# cargo-fuzz builds with `--cfg fuzzing` (`fuzz/`), under which the parser of
# a known_hosts line, private here, is reachable by the fuzzer.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
