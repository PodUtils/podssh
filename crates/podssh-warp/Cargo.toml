[package]
name = "podssh-warp"
description = "WARP's road over pod-warp: podssh's way out, its proxy and TLS for the API and the session, and a stream to HOST:PORT inside the tunnel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A feature crate (T-352, the operator's ruling Q52): podssh-cli takes it
# with its feature `warp`. The road itself is pod-warp's (PodUtils/podcrates):
# the registration, the identity file, MASQUE over HTTP/2 and HTTP/3, the
# check of the data path and the stack inside the tunnel. This crate gives
# it podssh's way out and podssh's resolver.
[dependencies]
podssh-ws = { path = "../podssh-ws" }
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.40.0" }
pod-warp = { git = "https://github.com/PodUtils/podcrates", tag = "v0.40.0" }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
