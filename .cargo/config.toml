# `cargo todo check` reads the work record in TODO/; `cargo todo set T-NNN STATUS`
# moves a status and derives the counts; `cargo todo remap FILE` moves the
# citations of an edited file (see TODO/RULES.md).
[alias]
todo = "run -q -p podssh-todo --"

# `cargo update` and a new dependency take the versions that the declared
# Rust allows, and a newer one only when no other matches (T-217). Each crate
# declares the newest stable Rust of the day (T-685).
[resolver]
incompatible-rust-versions = "fallback"

# The userspace stack of pod-netstack (WARP's road through pod-warp, and
# ZeroTier's road) owns more addresses than smoltcp's default of two: its
# own, the gateways and the address of each listener. Cargo reads no
# configuration of a dependency, so each binary sets it here.
[env]
SMOLTCP_IFACE_MAX_ADDR_COUNT = "8"
